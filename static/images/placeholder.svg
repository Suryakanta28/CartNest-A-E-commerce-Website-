<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>
  
  <!-- Soft Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="16" />
  
  <!-- Outer subtle circular ring -->
  <circle cx="200" cy="180" r="76" fill="#ffffff" opacity="0.85" filter="drop-shadow(0 4px 12px rgba(15, 23, 42, 0.05))" />
  
  <!-- Image / Camera Icon -->
  <g transform="translate(160, 140)">
    <rect x="0" y="8" width="80" height="60" rx="12" fill="none" stroke="url(#iconGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="40" cy="38" r="14" fill="none" stroke="url(#iconGrad)" stroke-width="4.5" />
    <circle cx="60" cy="22" r="3.5" fill="#0f766e" />
    <!-- Top lens flash hump -->
    <path d="M 26 8 L 32 0 L 48 0 L 54 8 Z" fill="url(#iconGrad)" />
  </g>
  
  <!-- Subtle Leaf / Sparkle Accent -->
  <path d="M 238 126 C 248 126 254 120 254 110 C 254 120 260 126 270 126 C 260 126 254 132 254 142 C 254 132 248 126 238 126 Z" fill="#14b8a6" />
  
  <!-- Text Label -->
  <text x="200" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">
    CartNest
  </text>
  <text x="200" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">
    Product Image Coming Soon
  </text>
</svg>
