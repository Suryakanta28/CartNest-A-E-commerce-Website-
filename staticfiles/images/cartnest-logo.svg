<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44" fill="none" width="180" height="44" aria-label="CartNest Logo">
  <!-- Minimalist Shopping Bag Icon with Leaf Sparkle -->
  <g transform="translate(2, 4)">
    <!-- Bag Handle -->
    <path d="M11 12V8C11 5.23858 13.2386 3 16 3C18.7614 3 21 5.23858 21 8V12" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Bag Body with Soft Rounded Corners -->
    <rect x="4" y="11" width="24" height="23" rx="5" fill="#0f766e"/>
    
    <!-- Interior Nest / Smile Curve Accent in Soft Mint -->
    <path d="M10 20C12 23 20 23 22 20" stroke="#ccfbf1" stroke-width="2" stroke-linecap="round"/>

    <!-- Small Leaf / Sparkle Accent symbol blooming at top right -->
    <path d="M22 6C24.5 4 28 4.5 29 8C27 9.5 23.5 9 22 6Z" fill="#10b981"/>
    <path d="M23.5 7.5L27 6" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="28.5" cy="3.5" r="1.5" fill="#34d399"/>
  </g>

  <!-- Clean CartNest Wordmark -->
  <text x="44" y="29" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.03em" fill="#0f172a">Cart<tspan fill="#0f766e" font-weight="700">Nest</tspan></text>
  
  <!-- Subtle Dot Accent -->
  <circle cx="152" cy="27" r="2.5" fill="#10b981"/>
</svg>
